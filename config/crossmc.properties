# CrossMC configuration
# ---------------------------------------------------------------------------
# Both processes (the Minecraft mod and the host adapter) must resolve the SAME
# shared-memory file. This file is the canonical default; copy/point to your own
# if you need a different location.
#
# How the config is found (first match wins):
#   1. -Dcrossmc.config=<path>  (JVM system property) or CROSSMC_CONFIG=<path> (env)
#   2. ./config/crossmc.properties   (relative to the working directory)
#   3. %LOCALAPPDATA%/CrossMC/crossmc.properties   (user-level override)
#   4. this file, bundled into the mod jar as /crossmc.properties
#
# This repository copy is the canonical source; it is packaged into the mod, so the mod always
# has a working default even with no user file.
#
# In the value, %VAR% placeholders are expanded from the environment
# (%LOCALAPPDATA%, %APPDATA%, %USERPROFILE%, %TEMP%, ...) and a leading ~ is the
# user home directory. '/' and '\' both work as separators.
# ---------------------------------------------------------------------------

# Shared-memory file used by every CrossMC process.
mapping.path=%LOCALAPPDATA%/CrossMC/bridge_v5.bin

# ---------------------------------------------------------------------------
# Host frame -> Minecraft world quad (client-side rendering).
#
# The host publishes its camera as a video frame; Minecraft draws it as a textured, unlit quad in
# the Minecraft world (not a HUD). Coordinates below are MINECRAFT WORLD SPACE and do NOT go through
# any host coordinate mapper. The host capture settings (resolution/fps) live in the host adapter's
# own config (HowToFishMC: host.properties -> render.*).
# ---------------------------------------------------------------------------
render.world.enabled=true
render.world.x=0
render.world.y=20
render.world.z=0
render.world.width=16
render.world.height=9
render.world.facePlayer=true
