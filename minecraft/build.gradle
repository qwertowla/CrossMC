plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

repositories {
}

loom {
	mods {
		"crossmc" {
			sourceSet sourceSets.main
		}
	}
}

// The Java binding lives in ../bindings/java. It is a plain library (not a Fabric mod), so its
// classes are compiled straight into the mod jar — that is how a non-mod library is shipped in a
// Fabric mod (nested "jars" are only loaded for actual mods). The binding also has its own
// standalone Gradle build (bindings/java) for independent building and testing.
sourceSets {
	main {
		java {
			srcDir '../bindings/java/src/main/java'
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}

	// Ship the canonical config as /crossmc.properties so a default is always available at
	// runtime; a user file under config/crossmc.properties (or CROSSMC_CONFIG) overrides it.
	from('../config/crossmc.properties')
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}
