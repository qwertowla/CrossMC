// Standalone build for the CrossMC Java binding.
//
// The binding is a plain Java 21 library that mirrors protocol/bridge_protocol.h and implements
// the shared-memory primitives. The Minecraft mod compiles these sources straight into its jar
// (see ../../minecraft/build.gradle); this project lets the binding be built and tested on its
// own, without Minecraft or Loom.
//
// Run with the wrapper from the minecraft project:
//   ..\minecraft\gradlew.bat -p . selftest
plugins {
	id 'java-library'
}

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
	withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

tasks.register('selftest', JavaExec) {
	group = 'verification'
	description = 'Runs ShmSelfTest against the real file-backed mapping.'
	dependsOn 'testClasses'
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'dev.crossmc.bridge.ShmSelfTest'
}

tasks.named('check') {
	dependsOn 'selftest'
}
